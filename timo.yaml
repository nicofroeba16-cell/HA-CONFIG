              is_state('update.home_assistant_operating_system_update','on')
              else 'green' }}
          - type: custom:mushroom-template-card
            primary: Letztes Backup
            secondary: >-
              {% set b =
              states('sensor.backup_last_successful_automatic_backup') %} {% if
              b in ['unknown','unavailable','none',''] %}
                Kein Backup bekannt
              {% else %}
                {% set dt = as_datetime(b, default=none) %}
                {% set hours = ((as_timestamp(now()) - as_timestamp(dt)) / 3600) | int %}
                {% if hours < 1 %}
                  vor wenigen Minuten
                {% elif hours < 24 %}
                  vor {{ hours }} Stunden
                {% else %}
                  vor {{ (hours / 24) | int }} Tagen
                {% endif %}
              {% endif %}
            icon: mdi:backup-restore
            icon_color: >-
              {% set b =
              states('sensor.backup_last_successful_automatic_backup') %} {% set
              ts = as_timestamp(b, default=0) %} {% set hours =
              ((as_timestamp(now()) - ts) / 3600) if ts > 0 else 9999 %} {% if
              ts == 0 or hours > 72 %} red {% elif hours > 24 %} orange {% else
              %} green {% endif %}
          - type: custom:mushroom-template-card
            primary: Systemwarnungen
            secondary: >-
              {% set p = states('sensor.offene_systemwarnungen') | int(0) %} {{
              p ~ ' offene Warnung(en)' if p > 0 else 'Keine Warnungen'
              }}
            icon: >-
              {{ 'mdi:shield-alert' if states('sensor.offene_systemwarnungen') |
              int(0) > 0 else 'mdi:shield-check' }}
            icon_color: >-
              {{ 'orange' if states('sensor.offene_systemwarnungen') | int(0) >
              0 else 'green' }}
