title: Zuhause Timo
navbar-templates:
  timo_nav:
    desktop:
      position: bottom
      show_labels: true
    mobile:
      show_labels: true
      mode: floating
    layout:
      auto_padding:
        enabled: true
        desktop_px: 160
        mobile_px: 224
    routes:
      - icon: mdi:home-floor-1
        url: /dashboard-timo/timo-zimmer
        label: Timo
      - icon: mdi:home-variant
        url: /dashboard-timo/huette
        label: Hütte
      - icon: mdi:home
        url: /dashboard-timo/haus
        label: Home
      - icon: mdi:tree
        url: /dashboard-timo/aussenbereich
        label: Außen
      - icon: mdi:server-network
        url: /dashboard-timo/system
        label: System
    styles: |
      :host {
        --navbar-primary-color: var(--apple-gold, #e8b57a);
      }

      .navbar.mobile {
        --navbar-left-margin: 0px;
      }

      .navbar.mobile,
      .navbar.mobile.floating {
        position: fixed !important;
        left: 0 !important;
        right: 0 !important;
        width: auto !important;
        max-width: none !important;
        transform: none !important;
        margin: 0 !important;
        padding-left: 16px !important;
        padding-right: 16px !important;
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important;
        box-sizing: border-box !important;
      }

      .navbar.mobile ha-card,
      ha-card.navbar-card.mobile,
      ha-card.navbar-card.mobile.floating,
      .navbar-card.mobile,
      .navbar-card.mobile.floating {
        display: flex !important;
        justify-content: stretch !important;
        align-items: stretch !important;
        gap: 0 !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        margin-bottom: 0 !important;
        transform: none !important;
        padding: 6px 8px !important;
        border-radius: 28px !important;
        box-sizing: border-box !important;
      }

      .navbar.mobile .route,
      .navbar-card.mobile .route {
        flex: 1 1 0 !important;
        min-width: 0 !important;
        max-width: none !important;
        width: auto !important;
        display: flex !important;
        justify-content: center !important;
      }

      .navbar.mobile .button {
        max-width: none !important;
        width: 100% !important;
      }

      .navbar.mobile .label {
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
views:
  - title: Haus
    path: haus
    icon: mdi:home
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Zuhause
            subtitle: Health · System
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                content: >-
                  {% set wan =
                  states('binary_sensor.fritz_box_6670_cable_wan_status') %} {{
                  'Online' if wan == 'on' else 'Offline' }}
                icon: mdi:web
                icon_color: >-
                  {{ 'green' if
                  is_state('binary_sensor.fritz_box_6670_cable_wan_status','on')
                  else 'red' }}
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-timo/system
              - type: template
                content: >-
                  {% set t = states('sensor.vertical_pool_heat_pump_temperatur')
                  %} Pool {{ t if t not in ['unknown','unavailable'] else '--' }}°
                icon: mdi:pool
                icon_color: cyan
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-timo/aussenbereich
              - type: template
                content: >-
                  {% set a = states('sensor.rasen_mahroboter_akku') %} Mäher {{
                  a if a not in ['unknown','unavailable'] else '--' }}%
                icon: mdi:robot-mower
                icon_color: >-
                  {% set a = states('sensor.rasen_mahroboter_akku') | float(0)
                  %} {% set sl = states('sensor.rasen_mahroboter_status') |
                  lower %} {% if 'charg' in sl or 'dock' in sl or 'park' in sl
                  or 'mode_not_active' in sl %}
                    {{ 'cyan' if a < 95 else 'green' }}
                  {% elif a < 20 %}
                    red
                  {% elif a < 40 %}
                    orange
                  {% else %}
                    green
                  {% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-timo/aussenbereich
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Bereiche
            subtitle: Live-Status & Navigation
          - type: custom:mushroom-template-card
            primary: Nico-Zimmer
            secondary: Dein Bereich · Medien & Licht
            icon: mdi:home-floor-negative-1
            icon_color: deep-purple
            vertical: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-timo/nico-zimmer
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Timo-Zimmer
            secondary: Dachgeschoss
            icon: mdi:home-floor-1
            icon_color: blue
            vertical: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-timo/timo-zimmer
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Hütte
            secondary: Gartenhaus & AVR
            icon: mdi:home-variant
            icon_color: orange
            vertical: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-timo/huette
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Außenbereich
            secondary: >-
              Pool {{ states('sensor.vertical_pool_heat_pump_temperatur')
              }}°C
            icon: mdi:tree
            icon_color: green
            vertical: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-timo/aussenbereich
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Erdgeschoss
            secondary: Mika · Juli · Flur · Wohnzimmer
            icon: mdi:home-floor-0
            icon_color: teal
            vertical: true
            tap_action:
              action: navigate
              navigation_path: /dashboard-timo/erdgeschoss
            grid_options:
              columns: 6
              rows: auto
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: System & Geräte
            subtitle: Infrastruktur
          - type: custom:mushroom-template-card
            primary: System
            secondary: Netzwerk · Backup
            icon: mdi:server-network
            icon_color: teal
            tap_action:
              action: navigate
              navigation_path: /dashboard-timo/system
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Warnungen
            secondary: >-
              {% set p = states('sensor.offene_systemwarnungen') | int(0) %}
              {{ p ~ ' offene Warnung(en)' if p > 0 else 'Keine Warnungen' }}
            icon: >-
              {{ 'mdi:shield-alert' if
              states('sensor.offene_systemwarnungen') | int(0) > 0 else
              'mdi:shield-check' }}
            icon_color: >-
              {{ 'orange' if states('sensor.offene_systemwarnungen') |
              int(0) > 0 else 'green' }}
            tap_action:
              action: navigate
              navigation_path: /dashboard-timo/system-warnungen
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Mobilgeräte
            secondary: Handy · Tablet · Uhr
            icon: mdi:cellphone
            icon_color: indigo
            tap_action:
              action: navigate
              navigation_path: /dashboard-timo/mobilgeraete
            grid_options:
              columns: 6
              rows: auto
      - type: grid
        cards:
          - type: custom:navbar-card
            template: timo_nav
  - title: Mobilgeräte
    path: mobilgeraete
    icon: mdi:cellphone
    subview: true
    back_path: /dashboard-timo/haus
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:battery-state-card
            title: Akkus
            sort:
              - by: state
            tap_action:
              action: more-info
            bulk_rename: false
            collapse: 8
            min_width: 0
            round: 0
            spacing: 4
            colors:
              steps:
                - value: 20
                  color: '#FF453A'
                - value: 50
                  color: '#FFD60A'
                - value: 100
                  color: '#30D158'
            charging_state:
              state:
                - Charging
                - charging
              icon: mdi:battery-charging
              color: '#64D2FF'
              secondary_info_text: Lädt
            secondary_info: '{charging.text}'
            entities:
              - entity: sensor.iphone_von_nico_froba_battery_level
                name: Nico iPhone
                icon: mdi:cellphone
                charging_state:
                  entity_id: sensor.iphone_von_nico_froba_battery_state
                  state:
                    - Charging
                    - charging
                  icon: mdi:battery-charging
                  color: '#64D2FF'
                  secondary_info_text: Lädt
              - entity: sensor.ipad_pro_von_nico_battery_level
                name: Nico iPad Pro
                icon: mdi:tablet
                charging_state:
                  entity_id: sensor.ipad_pro_von_nico_battery_state
                  state:
                    - Charging
                    - charging
                  icon: mdi:battery-charging
                  color: '#64D2FF'
                  secondary_info_text: Lädt
              - entity: sensor.iphone_von_nico_froba_watch_battery_level
                name: Nico Watch
                icon: mdi:watch
                charging_state:
                  entity_id: sensor.iphone_von_nico_froba_watch_battery_state
                  state:
                    - Charging
                    - charging
                  icon: mdi:battery-charging
                  color: '#64D2FF'
                  secondary_info_text: Lädt
              - entity: sensor.timo_handy_battery_level
                name: Timo Handy
                icon: mdi:cellphone
                charging_state:
                  entity_id: sensor.timo_handy_battery_state
                  state:
                    - Charging
                    - charging
                  icon: mdi:battery-charging
                  color: '#64D2FF'
                  secondary_info_text: Lädt
              - entity: sensor.iphone_von_mika_battery_level
                name: Mika iPhone
                icon: mdi:cellphone
                charging_state:
                  entity_id: sensor.iphone_von_mika_battery_state
                  state:
                    - Charging
                    - charging
                  icon: mdi:battery-charging
                  color: '#64D2FF'
                  secondary_info_text: Lädt
              - entity: sensor.pixel_9_pro_xl_battery_level
                name: Gabi Pixel
                icon: mdi:cellphone
                charging_state:
                  entity_id: sensor.pixel_9_pro_xl_battery_state
                  state:
                    - Charging
                    - charging
                  icon: mdi:battery-charging
                  color: '#64D2FF'
                  secondary_info_text: Lädt
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                content: Nico
                icon: mdi:bell-ring
                tap_action:
                  action: call-service
                  service: notify.mobile_app_iphone_von_nico_froba
                  data:
                    title: Mobilgeräte
                    message: Ping vom Dashboard
                    data:
                      push:
                        sound:
                          name: default
                          volume: 1
                      interruption-level: time-sensitive
                  confirmation:
                    text: Nico iPhone anpingen?
              - type: template
                content: iPad
                icon: mdi:bell-ring
                tap_action:
                  action: call-service
                  service: notify.mobile_app_ipad_pro_von_nico
                  data:
                    title: Mobilgeräte
                    message: Ping vom Dashboard
                    data:
                      push:
                        sound:
                          name: default
                          volume: 1
                      interruption-level: time-sensitive
                  confirmation:
                    text: iPad anpingen?
              - type: template
                content: Timo
                icon: mdi:bell-ring
                tap_action:
                  action: call-service
                  service: notify.mobile_app_timo_handy
                  data:
                    title: Mobilgeräte
                    message: Ping vom Dashboard
                    data:
                      push:
                        sound:
                          name: default
                          volume: 1
                      interruption-level: time-sensitive
                  confirmation:
                    text: Timo Handy anpingen?
              - type: template
                content: Mika
                icon: mdi:bell-ring
                tap_action:
                  action: call-service
                  service: notify.mobile_app_iphone_von_mika
                  data:
                    title: Mobilgeräte
                    message: Ping vom Dashboard
                    data:
                      push:
                        sound:
                          name: default
                          volume: 1
                      interruption-level: time-sensitive
                  confirmation:
                    text: Mika iPhone anpingen?
              - type: template
                content: Gabi
                icon: mdi:bell-ring
                tap_action:
                  action: call-service
                  service: notify.mobile_app_pixel_9_pro_xl
                  data:
                    title: Mobilgeräte
                    message: Ping vom Dashboard
                    data:
                      push:
                        sound:
                          name: default
                          volume: 1
                      interruption-level: time-sensitive
                  confirmation:
                    text: Gabi Pixel anpingen?
      - type: grid
        cards:
          - type: custom:navbar-card
            template: timo_nav
  - title: Nico-Zimmer
    path: nico-zimmer
    icon: mdi:home-floor-negative-1
    subview: true
    back_path: /dashboard-timo/haus
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Beleuchtung
            subtitle: TV · Schrank · Schreibtisch
          - type: custom:ios-light-card
            entity: light.kronach_fernseher_links
            name: TV Links
          - type: custom:ios-light-card
            entity: light.kronach_fernseher_rechts
            name: TV Rechts
          - type: custom:ios-light-card
            entity: light.kronach_schrank
            name: Schrank
          - type: custom:ios-light-card
            entity: switch.schreibtisch_rgb_standlampe_steckdose_1
            name: Schreibtischlampe
      - type: grid
        cards:
          - type: conditional
            conditions:
              - entity: group.nico_beleuchtung
                state: 'on'
            card:
              type: custom:mushroom-template-card
              primary: Licht Master
              secondary: Geräte an
              icon: mdi:power
              icon_color: green
              tap_action:
                action: call-service
                service: homeassistant.turn_off
                target:
                  entity_id: group.nico_beleuchtung
                confirmation:
                  text: Alle Lichter ausschalten?
            grid_options:
              columns: 6
              rows: auto
          - type: conditional
            conditions:
              - entity: group.nico_beleuchtung
                state_not: 'on'
            card:
              type: custom:mushroom-template-card
              primary: Licht Master
              secondary: Alles aus
              icon: mdi:power
              icon_color: red
              tap_action:
                action: call-service
                service: homeassistant.turn_on
                target:
                  entity_id: group.nico_beleuchtung
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            primary: Prisma
            secondary: Schrank-Effekt
            icon: mdi:palette
            icon_color: purple
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.kronach_kronach_prisma
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Medien-Center
            subtitle: Apple TV · Denon · PS5
          - type: conditional
            conditions:
              - entity: binary_sensor.nico_medien_aktiv
                state: 'on'
            card:
              type: custom:mushroom-template-card
              primary: Medien Master
              secondary: Geräte aktiv
              icon: mdi:power
              icon_color: green
              tap_action:
                action: call-service
                service: script.turn_on
                target:
                  entity_id: script.nico_medien_master_zentrale
                confirmation:
                  text: Medien ausschalten?
            grid_options:
              columns: 6
              rows: auto
          - type: conditional
            conditions:
              - entity: binary_sensor.nico_medien_aktiv
                state_not: 'on'
            card:
              type: custom:mushroom-template-card
              primary: Medien Master
              secondary: Alles aus
              icon: mdi:power
              icon_color: red
              tap_action:
                action: call-service
                service: script.turn_on
                target:
                  entity_id: script.nico_medien_master_zentrale
            grid_options:
              columns: 6
              rows: auto
          - type: custom:mushroom-template-card
            entity: switch.tv_steckdose_1
            primary: TV Steckdose
            secondary: '{{ ''Ein'' if is_state(''switch.tv_steckdose_1'',''on'') else ''Aus'' }}'
            icon: mdi:power-socket-eu
            icon_color: >-
              {{ 'green' if is_state('switch.tv_steckdose_1','on') else 'grey'
              }}
            tap_action:
              action: toggle
          - type: custom:ios-media-player
            entity: media_player.nico_zimmer_untergeschoss_apple_tv
            name: Apple TV
            volume_entity: media_player.denon_avr_x1300w
          - type: custom:ios-media-player
            entity: media_player.denon_avr_x1300w
            name: Denon AVR
            role: receiver
          - type: custom:ios-media-player
            entity: media_player.playstation_5
            name: PlayStation 5
      - type: grid
        cards:
          - type: custom:navbar-card
            template: timo_nav
  - title: Medien
    path: medien
    icon: mdi:television
    subview: true
    back_path: /dashboard-timo/haus
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Nico-Zimmer
            subtitle: Apple TV · Denon · PS5
          - type: conditional
            conditions:
              - entity: binary_sensor.nico_medien_aktiv
                state: 'on'
            card:
              type: custom:mushroom-template-card
              primary: Medien Master
