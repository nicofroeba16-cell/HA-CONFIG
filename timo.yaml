  - title: Systemwarnungen
    path: system-warnungen
    icon: mdi:alert-circle
    subview: true
    back_path: /dashboard-timo/haus
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: conditional
            conditions:
              - entity: sensor.offene_systemwarnungen
                state: '0'
            card:
              type: custom:mushroom-template-card
              primary: Alles klar
              secondary: Keine offenen Warnungen
              icon: mdi:shield-check
              icon_color: green
              layout: horizontal
          - type: conditional
            conditions:
              - entity: binary_sensor.fritz_box_6670_cable_wan_status
                state_not: 'on'
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.wan_warnung_quittiert
              primary: Internetverbindung
              secondary: |-
                {% if is_state('input_boolean.wan_warnung_quittiert','on') %}
                  ✓ Warnung gelesen
                {% else %}
                  WAN-Verbindung ausgefallen / unbekannt
                {% endif %}
              icon: >-
                {{ 'mdi:check-circle' if
                is_state('input_boolean.wan_warnung_quittiert','on') else
                'mdi:web-off' }}
              icon_color: >-
                {{ 'green' if
                is_state('input_boolean.wan_warnung_quittiert','on') else 'red'
                }}
              tap_action:
                action: toggle
          - type: conditional
            conditions:
              - entity: switch.adguard_home_schutz
                state_not: 'on'
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.adguard_warnung_quittiert
              primary: AdGuard Home
              secondary: >-
                {% if is_state('input_boolean.adguard_warnung_quittiert','on')
                %}
                  ✓ Warnung gelesen
                {% else %}
                  Schutz ist deaktiviert
                {% endif %}
              icon: >-
                {{ 'mdi:check-circle' if
                is_state('input_boolean.adguard_warnung_quittiert','on') else
                'mdi:shield-alert' }}
              icon_color: >-
                {{ 'green' if
                is_state('input_boolean.adguard_warnung_quittiert','on') else
                'orange' }}
              tap_action:
                action: toggle
          - type: custom:mushroom-template-card
            entity: input_boolean.backup_warnung_quittiert
            primary: Backup
            secondary: >-
              {% set b =
              states('sensor.backup_last_successful_automatic_backup') %} {% set
              ts = as_timestamp(b, 0) %} {% set hours = ((as_timestamp(now()) -
              ts) / 3600) if ts > 0 else 9999 %} {% if
              is_state('input_boolean.backup_warnung_quittiert','on') %}
                ✓ Warnung gelesen
              {% elif ts == 0 %}
                Kein erfolgreiches Backup bekannt
              {% elif hours > 24 %}
                Letztes Backup vor {{ hours | round(0) }} Stunden
              {% else %}
                Letztes Backup ok
              {% endif %}
            icon: >-
              {{ 'mdi:check-circle' if
              is_state('input_boolean.backup_warnung_quittiert','on') else
              'mdi:backup-restore' }}
            icon_color: >-
              {% set b =
              states('sensor.backup_last_successful_automatic_backup') %} {% set
              ts = as_timestamp(b, 0) %} {% set hours = ((as_timestamp(now()) -
              ts) / 3600) if ts > 0 else 9999 %} {% if
              is_state('input_boolean.backup_warnung_quittiert','on') %}
                green
              {% elif ts == 0 or hours > 24 %}
                orange
              {% else %}
                green
              {% endif %}
            tap_action:
              action: toggle
          - type: conditional
            conditions:
              - entity: update.home_assistant_core_update
                state: 'on'
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.core_update_warnung_quittiert
              primary: Home Assistant Core
              secondary: >-
                {% if
                is_state('input_boolean.core_update_warnung_quittiert','on') %}
                  ✓ Update-Warnung gelesen
                {% else %}
                  Neues Core-Update verfügbar
                {% endif %}
              icon: >-
                {{ 'mdi:check-circle' if
                is_state('input_boolean.core_update_warnung_quittiert','on')
                else 'mdi:home-assistant' }}
              icon_color: >-
                {{ 'green' if
                is_state('input_boolean.core_update_warnung_quittiert','on')
                else 'orange' }}
              tap_action:
                action: toggle
          - type: conditional
            conditions:
              - entity: update.home_assistant_operating_system_update
                state: 'on'
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.os_update_warnung_quittiert
              primary: Home Assistant OS
              secondary: >-
                {% if is_state('input_boolean.os_update_warnung_quittiert','on')
                %}
                  ✓ Update-Warnung gelesen
                {% else %}
                  Neues OS-Update verfügbar
                {% endif %}
              icon: >-
                {{ 'mdi:check-circle' if
                is_state('input_boolean.os_update_warnung_quittiert','on') else
                'mdi:server' }}
              icon_color: >-
                {{ 'green' if
                is_state('input_boolean.os_update_warnung_quittiert','on') else
                'orange' }}
              tap_action:
                action: toggle
          - type: custom:mushroom-template-card
            entity: input_boolean.mahroboter_warnung_quittiert
            primary: Mähroboter
            secondary: >-
              {% set s = states('sensor.rasen_mahroboter_status') | string %} {%
              set sl = s | lower %} {% if
              is_state('input_boolean.mahroboter_warnung_quittiert','on') %}
                ✓ Warnung gelesen
              {% elif 'error' in sl or 'fehler' in sl or 'stuck' in sl or
              'trapped' in sl %}
                Fehler
              {% elif 'mode_not_active' in sl or sl in
              ['not_active','inactive','off'] %}
                Inaktiv
              {% elif 'park' in sl or sl in ['docked','home','idle'] %}
                Parkt
              {% elif 'charg' in sl %}
                Lädt
              {% else %}
                {{ s }}
              {% endif %}
            icon: >-
              {{ 'mdi:check-circle' if
              is_state('input_boolean.mahroboter_warnung_quittiert','on') else
              'mdi:robot-mower-alert' }}
            icon_color: >-
              {% set s = states('sensor.rasen_mahroboter_status') | lower %} {%
              if is_state('input_boolean.mahroboter_warnung_quittiert','on') %}
                green
              {% elif 'error' in s or 'fehler' in s or 'stuck' in s or 'trapped'
              in s %}
                red
              {% else %}
                green
              {% endif %}
            tap_action:
              action: toggle
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Zurücksetzen
            secondary: Alle ungelesen
            icon: mdi:refresh
            icon_color: blue
            layout: horizontal
            tap_action:
              action: call-service
              service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.wan_warnung_quittiert
                  - input_boolean.adguard_warnung_quittiert
                  - input_boolean.backup_warnung_quittiert
                  - input_boolean.core_update_warnung_quittiert
                  - input_boolean.os_update_warnung_quittiert
                  - input_boolean.mahroboter_warnung_quittiert
              confirmation: Alle Warnungen wieder als ungelesen markieren?
      - type: grid
        cards:
          - type: custom:navbar-card
            template: timo_nav
