                action: call-service
                service: script.turn_on
                target:
                  entity_id: script.nico_medien_master_zentrale
                confirmation:
                  text: Medien ausschalten?
          - type: conditional
            conditions:
              - entity: binary_sensor.nico_medien_aktiv
                state_not: 'on'
            card:
              type: custom:mushroom-template-card
              primary: Medien Master
              secondary: Alles aus
              icon: mdi:power
              icon_color: red
              tap_action:
                action: call-service
                service: script.turn_on
                target:
                  entity_id: script.nico_medien_master_zentrale
          - type: custom:ios-media-player
            entity: media_player.nico_zimmer_untergeschoss_apple_tv
            name: Apple TV
            volume_entity: media_player.denon_avr_x1300w
          - type: custom:ios-media-player
            entity: media_player.denon_avr_x1300w
            name: Denon AVR (Nico)
            role: receiver
          - type: custom:ios-media-player
            entity: media_player.playstation_5
            name: PlayStation 5
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Hütte
            subtitle: Denon · GigaTV
          - type: custom:ios-media-player
            entity: media_player.denon_avr_x1800h
            name: Denon AVR (Hütte)
            role: receiver
          - type: custom:ios-media-player
            entity: media_player.gigatv_home
            name: GigaTV
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Weitere Geräte
            subtitle: Timo · Mika
          - type: custom:ios-media-player
            entity: media_player.schlafzimmer
            name: Audio Schlafzimmer (Timo)
          - type: custom:ios-media-player
            entity: media_player.fire_tv_192_168_178_54
            name: Mika Fernseher
      - type: grid
        cards:
          - type: custom:navbar-card
            template: timo_nav
  - title: System & Netzwerk
    path: system
    icon: mdi:server-network
    subview: true
    back_path: /dashboard-timo/haus
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: FRITZ!Box
            subtitle: Internet & Router
          - type: custom:mushroom-template-card
            primary: Internet Status
            secondary: >-
              {% set wan =
              states('binary_sensor.fritz_box_6670_cable_wan_status') %} {{
              'Verbunden' if wan == 'on' else ('Offline' if wan == 'off' else
              'Unbekannt') }}
            icon: mdi:web
            icon_color: >-
              {{ 'green' if
              is_state('binary_sensor.fritz_box_6670_cable_wan_status','on')
              else 'red' }}
          - type: custom:mushroom-template-card
            primary: Neustart
            secondary: Fritz!Box
            icon: mdi:restart
            icon_color: red
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.fritz_box_6670_cable_reboot
              confirmation: Router wirklich neu starten?
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: WLAN Steuerung
            subtitle: 2,4 GHz · 5 GHz · Gast
          - type: custom:mushroom-template-card
            entity: switch.fritz_box_6670_cable_wi_fi_main_2_4ghz
            primary: 2,4 GHz Netz
            secondary: >-
              {{ 'Ein' if
              is_state('switch.fritz_box_6670_cable_wi_fi_main_2_4ghz','on')
              else 'Aus' }}
            icon: mdi:wifi
            icon_color: >-
              {{ 'blue' if
              is_state('switch.fritz_box_6670_cable_wi_fi_main_2_4ghz','on')
              else 'grey' }}
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: switch.fritz_box_6670_cable_wi_fi_main_5ghz
            primary: 5 GHz Netz
            secondary: >-
              {{ 'Ein' if
              is_state('switch.fritz_box_6670_cable_wi_fi_main_5ghz','on') else
              'Aus' }}
            icon: mdi:wifi
            icon_color: >-
              {{ 'blue' if
              is_state('switch.fritz_box_6670_cable_wi_fi_main_5ghz','on') else
              'grey' }}
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            entity: switch.fritz_box_6670_cable_wi_fi_guest
            primary: Gast-WLAN
            secondary: >-
              {{ 'Ein' if
              is_state('switch.fritz_box_6670_cable_wi_fi_guest','on') else
              'Aus' }}
            icon: mdi:wifi-lock
            icon_color: >-
              {{ 'orange' if
              is_state('switch.fritz_box_6670_cable_wi_fi_guest','on') else
              'grey' }}
            tap_action:
              action: toggle
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: AdGuard Home
            subtitle: DNS-Schutz & Filterung
          - type: custom:mushroom-template-card
            entity: switch.adguard_home_schutz
            primary: AdGuard Schutz
            secondary: |-
              {% if is_state('switch.adguard_home_schutz','on') %}
                Schutz aktiv
              {% else %}
                Schutz deaktiviert
              {% endif %}
            icon: mdi:shield-check
            icon_color: >-
              {{ 'green' if is_state('switch.adguard_home_schutz','on') else
              'red' }}
            tap_action:
              action: toggle
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: System Updates
            subtitle: Home Assistant & Backup
          - type: custom:mushroom-template-card
            entity: update.home_assistant_core_update
            primary: Core Update
            secondary: >-
              {{ 'Update verfügbar' if
              is_state('update.home_assistant_core_update','on') else 'Aktuell'
              }}
            icon: mdi:home-assistant
            icon_color: >-
              {{ 'orange' if is_state('update.home_assistant_core_update','on')
              else 'green' }}
          - type: custom:mushroom-template-card
