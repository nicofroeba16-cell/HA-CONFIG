# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/apple-optik.js?v=1.9.23

# YAML-Dashboards unter /config/dashboards/. Storage-Duplikate dashboard_x / dashboard-timo entfernen.
lovelace:
  dashboards:
    dashboard-x:
      mode: yaml
      title: Zuhause
      icon: mdi:home
      show_in_sidebar: true
      filename: dashboards/zuhause.yaml
    dashboard-timo:
      mode: yaml
      title: Timo
      show_in_sidebar: false
      filename: dashboards/timo.yaml
    dashboard-juli:
      mode: yaml
      title: Juli
      show_in_sidebar: false
      filename: dashboards/juli.yaml
    dashboard-mika:
      mode: yaml
      title: Mika
      show_in_sidebar: false
      filename: dashboards/mika.yaml
    dashboard-gabi:
      mode: yaml
      title: Gabi
      show_in_sidebar: false
      filename: dashboards/gabi.yaml


automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

group:
  nico_beleuchtung:
    name: Nico Beleuchtung
    icon: mdi:lightbulb-group
    entities:
      - light.kronach_fernseher_links
      - light.kronach_fernseher_rechts
      - light.kronach_schrank
      - switch.schreibtisch_rgb_standlampe_steckdose_1
  hutte_beleuchtung:
    name: Hütte Beleuchtung
    icon: mdi:lightbulb-group
    entities:
      - light.hutte
      - light.tisch_tisch

logger:
  default: warning

recorder:
  purge_keep_days: 10
  exclude:
    entity_globs:
      - device_tracker.pc_*
      - device_tracker.fritz_*
      - sensor.*_ssid
      - sensor.*_bssid
      - sensor.*_geocoded_location
      - sensor.*_last_update_trigger
      - sensor.*_storage
      - sensor.*_sim_*
    entities:
      - device_tracker.a22_von_eva
      - device_tracker.amazon_4de2fee8e
      - device_tracker.appletvnico
      - device_tracker.brotherhl_l3210cw
      - device_tracker.brothermfc_j4410dw
      - device_tracker.chromecast
      - device_tracker.denon_avr_x1800h
      - device_tracker.denonavr_x1300w
      - device_tracker.fb12590b136229fe
      - device_tracker.gigatvhome_gigatv
      - device_tracker.gigatvhome_gigatv_2
      - device_tracker.google_home_mini
      - device_tracker.google_home_mini_2
      - device_tracker.google_home_mini_3
      - device_tracker.homeassistant
      - device_tracker.hue
      - device_tracker.iphone
      - device_tracker.iphone_2
      - device_tracker.iphone_3
      - device_tracker.iphone_4
