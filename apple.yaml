# Apple Optik 1.6 — Tokens + systemYellow Licht
# /homeassistant/themes/apple.yaml
# Designs neu laden, Profil → Apple

Apple:
  # --- Tokens (werden zu --apple-*) ---
  apple-bg: "#000000"
  apple-surface: "#1C1C1E"
  apple-elevated: "#2C2C2E"
  apple-label: "#F5F5F7"
  apple-secondary: "#C7C7CC"
  apple-tertiary: "#8E8E93"
  apple-gold: "#E8B57A"
  apple-gold-dim: "#C9893A"
  apple-light: "#FFD60A"
  apple-hairline: "rgba(255, 255, 255, 0.14)"
  apple-fill: "rgba(118, 118, 128, 0.36)"
  apple-red: "#FF6961"
  apple-orange: "#FFB340"
  apple-green: "#30DB5B"
  apple-blue: "#64D2FF"
  apple-indigo: "#7D7AFF"

  primary-color: "#E8B57A"
  accent-color: "#E8B57A"
  state-icon-color: "#E8B57A"
  dark-primary-color: "#E8B57A"
  light-primary-color: "#F0C089"

  ha-font-family-body: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif"
  ha-font-family-heading: "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif"
  ha-font-family-code: "'SF Mono', ui-monospace, Menlo, monospace"
  paper-font-common-base_-_font-family: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"

  ha-card-border-radius: "20px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "none"
  ha-dialog-border-radius: "28px"
  md-card-border-radius: "20px"

  # --- Mushroom ---
  mush-spacing: 10px
  mush-icon-size: 30px
  mush-icon-border-radius: 8px
  mush-control-border-radius: 20px
  mush-chip-border-radius: 18px
  mush-chip-height: 32px
  mush-chip-spacing: 6px
  mush-chip-background: "rgba(118, 118, 128, 0.36)"
  mush-chip-text-color: "#F5F5F7"
  mush-chip-icon-color: "#F5F5F7"
  mush-card-primary-color: "#F5F5F7"
  mush-card-secondary-color: "#C7C7CC"
  mush-card-primary-font-size: 17px
  mush-card-primary-font-weight: 600
  mush-card-primary-line-height: 1.2
  mush-card-secondary-font-size: 13px
  mush-card-secondary-font-weight: 500
  mush-card-secondary-line-height: 1.3
  mush-title-font-size: 34px
  mush-title-font-weight: 700
  mush-title-padding: "4px 4px 8px"
  mush-title-color: "#F5F5F7"
  mush-subtitle-font-size: 13px
  mush-subtitle-font-weight: 500
  mush-subtitle-color: "#C7C7CC"
  mush-rgb-disabled: "142, 142, 147"
  mush-rgb-red: "255, 105, 97"
  mush-rgb-pink: "255, 55, 95"
  mush-rgb-purple: "218, 143, 255"
  mush-rgb-deep-purple: "191, 90, 242"
  mush-rgb-indigo: "125, 122, 255"
  mush-rgb-blue: "10, 132, 255"
  mush-rgb-light-blue: "100, 210, 255"
  mush-rgb-cyan: "100, 210, 255"
  mush-rgb-teal: "64, 203, 224"
  mush-rgb-green: "48, 219, 91"
  mush-rgb-light-green: "48, 219, 91"
  mush-rgb-lime: "172, 224, 64"
  mush-rgb-yellow: "255, 214, 10"
  mush-rgb-amber: "255, 179, 64"
  mush-rgb-orange: "255, 179, 64"
  mush-rgb-deep-orange: "255, 105, 97"
  mush-rgb-brown: "188, 148, 104"
  mush-rgb-grey: "199, 199, 204"
  mush-rgb-blue-grey: "174, 174, 178"

  switch-checked-color: "#30DB5B"
  switch-unchecked-button-color: "#FFFFFF"
  switch-unchecked-track-color: "#39393D"
  slider-color: "#E8B57A"
  mdc-theme-primary: "#E8B57A"
  mdc-theme-secondary: "#E8B57A"
  input-idle-line-color: "rgba(84, 84, 88, 0.65)"
  input-fill-color: "#2C2C2E"
  input-dropdown-icon-color: "#E8B57A"

  error-color: "#FF6961"
  warning-color: "#FFB340"
  success-color: "#30DB5B"
  info-color: "#64D2FF"

  modes:
    dark:
      primary-background-color: "#000000"
      lovelace-background: "#000000"
      secondary-background-color: "#1C1C1E"
      card-background-color: "#1C1C1E"
      ha-card-background: "#1C1C1E"
      primary-text-color: "#F5F5F7"
      secondary-text-color: "#C7C7CC"
      disabled-text-color: "#8E8E93"
      text-primary-color: "#F5F5F7"
      text-light-primary-color: "#F5F5F7"
      divider-color: "rgba(255, 255, 255, 0.14)"
      disabled-color: "#3A3A3C"
      app-header-background-color: "rgba(0, 0, 0, 0.55)"
      app-header-text-color: "#F5F5F7"
      app-header-selection-bar-color: "#E8B57A"
      paper-listbox-background-color: "#1C1C1E"
      paper-card-background-color: "#1C1C1E"
      sidebar-background-color: "#000000"
      sidebar-icon-color: "#C7C7CC"
      sidebar-text-color: "#F5F5F7"
      sidebar-selected-icon-color: "#E8B57A"
      sidebar-selected-text-color: "#E8B57A"
      table-row-background-color: "#1C1C1E"
      table-row-alternative-background-color: "#2C2C2E"
      input-fill-color: "#2C2C2E"
      markdown-code-background-color: "#2C2C2E"
      switch-unchecked-track-color: "#39393D"
      apple-light: "#FFD60A"
    light:
      primary-background-color: "#F2F2F7"
      secondary-background-color: "#FFFFFF"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      primary-text-color: "#1C1C1E"
      secondary-text-color: "#3A3A3C"
      disabled-text-color: "#8E8E93"
      text-primary-color: "#1C1C1E"
      divider-color: "rgba(60, 60, 67, 0.29)"
      app-header-background-color: "rgba(242, 242, 247, 0.82)"
      app-header-text-color: "#1C1C1E"
      sidebar-background-color: "#F2F2F7"
      sidebar-icon-color: "#3A3A3C"
      sidebar-text-color: "#1C1C1E"
      sidebar-selected-icon-color: "#C9893A"
      sidebar-selected-text-color: "#C9893A"
      paper-card-background-color: "#FFFFFF"
      input-fill-color: "#E5E5EA"
      switch-unchecked-track-color: "#E9E9EB"
      apple-light: "#FFCC00"
