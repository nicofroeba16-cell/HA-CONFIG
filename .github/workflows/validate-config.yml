name: Validate configuration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Check whitespace
        run: git diff-tree --check HEAD
      - name: Validate YAML, generator, runtime patch and script syntax
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Test dashboard routes and background transitions
        run: node tests/routes.test.cjs
      - name: Verify tests left the checkout unchanged
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
